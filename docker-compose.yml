version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspaces/CodaHertz
    command: sleep infinity
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/codahertz
      - SPRING_DATASOURCE_USERNAME=codahertz
      - SPRING_DATASOURCE_PASSWORD=codahertz
    networks:
      - codahertz-network

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - codahertz-network

volumes:
  postgres-data:

networks:
  codahertz-network:
    driver: bridge
